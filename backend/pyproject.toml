[project]
name = "mps-aj-social-insights-api"
version = "0.1.0"
description = "AJ Social Insights — backend API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.14.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "openai>=3.60.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "typer>=0.29.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S", "PTH", "RET", "C4"]
# RUF001: Arabic text is intentional in this bilingual product, not a confusable typo.
ignore = ["S101", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/seed/**" = ["S311"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = ["integration: needs the postgres-test database"]
